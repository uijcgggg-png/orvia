name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','logo.svg','manifest.webmanifest','sw.js','.github/workflows/apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web assets
        run: |
          mkdir -p /tmp/app/www
          cp index.html logo.svg manifest.webmanifest sw.js /tmp/app/www/
      - name: Create Capacitor Android project
        working-directory: /tmp/app
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Orvia com.orvia.assistant --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: /tmp/app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: orvia-apk
          path: /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk
